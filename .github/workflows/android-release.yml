# Release pipeline: push a tag (see scripts/release.sh) and this workflow builds
# the release APK and attaches it to the GitHub release. F-Droid does NOT use
# this APK - its buildbot builds from the same tag itself (docs/FDROID.md).
name: Android release build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # Optional: keep signing with the project key by storing the keystore
      # base64-encoded (and the passwords) in repository secrets. Without them
      # the APK is signed with the debug key, which is fine for GitHub releases
      # because F-Droid re-signs its own build anyway.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "keystore.jks restored ($(wc -c < keystore.jks) bytes)"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Show what was built
        run: ls -l ImapNotesX/build/outputs/apk/release/

      - uses: softprops/action-gh-release@v2
        with:
          files: ImapNotesX/build/outputs/apk/release/*.apk
          fail_on_missing: true
          generate_release_notes: true
